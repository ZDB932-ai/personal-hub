<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>我的主页 · Personal Hub</title>
    <script>
      ;(function () {
        try {
          var t = JSON.parse(localStorage.getItem('xk.theme.v1') || '{}')
          var m = t.mode === 'dark' || t.mode === 'system' ? t.mode : 'light'
          if (!localStorage.getItem('xk.theme.light-baseline.v1')) m = 'light'
          if (m === 'system') {
            m = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
          }
          document.documentElement.dataset.theme = m
          document.documentElement.dataset.accent = ['teal', 'indigo', 'blue', 'violet', 'rose', 'amber', 'coral', 'cobalt', 'orchid'].includes(t.accent) ? t.accent : 'teal'
          document.documentElement.dataset.interface = ['classic', 'sunrise', 'aurora', 'precision'].includes(t.style) ? t.style : 'classic'
          document.documentElement.style.colorScheme = m
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
