name: Upload verified Android release asset

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version, without v
        required: true
        type: string
      sha256:
        description: Expected APK SHA-256 from the local release manifest
        required: true
        type: string

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      VERSION: ${{ inputs.version }}
      EXPECTED_SHA: ${{ inputs.sha256 }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download and verify the published package
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{64}$ ]]
          file="Personal-Hub-$VERSION-Android.apk"
          curl --fail --show-error --silent --proto '=https' --connect-timeout 20 --max-time 180 "https://111.91.19.235/downloads/$VERSION/$file" --output "$file"
          printf '%s  %s\n' "$EXPECTED_SHA" "$file" | sha256sum -c -
      - name: Upload to the existing release
        shell: bash
        run: |
          set -euo pipefail
          file="Personal-Hub-$VERSION-Android.apk"
          gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json tagName,targetCommitish,isDraft
          gh release upload "v$VERSION" "$file" --repo "$GITHUB_REPOSITORY"
