name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run sync:typecheck
      - run: npm run test -- --maxWorkers=2
      - run: node scripts/check-release-assets.mjs
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Verify core flows and desktop pet preview
        env:
          PHUB_BROWSER_CHANNEL: chromium
        run: |
          npm run preview -- --host 127.0.0.1 --port 4183 --strictPort > /tmp/phub-preview.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4183 > /dev/null; then break; fi
            sleep 1
          done
          npm run test:ui
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
